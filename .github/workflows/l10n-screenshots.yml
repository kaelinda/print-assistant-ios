name: Localization screenshots

on:
  workflow_dispatch:
  # The dispatch API is unavailable from this environment. A push to the
  # screenshot branch starts the same job; develop only runs it manually.
  push:
    branches:
      - cursor/l10n-screenshots-6a75

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check string catalogs
        run: python3 Scripts/check_string_catalog.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project PrintAssistant.xcodeproj \
            -scheme PrintAssistant \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty

      - name: Select simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Boot simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          xcrun simctl status_bar "$SIMULATOR_UDID" override \
            --time "9:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4

      - name: Capture screenshots
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          TEST_RUNNER_SCREENSHOT_DIR: ${{ runner.temp }}/l10n-screenshots
        run: |
          set -o pipefail
          mkdir -p "$TEST_RUNNER_SCREENSHOT_DIR"
          if ! xcodebuild \
            -project PrintAssistant.xcodeproj \
            -scheme PrintAssistant \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:PrintAssistantUITests/LocalizationScreenshotTests \
            -resultBundlePath "$RUNNER_TEMP/L10nScreenshots.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee xcodebuild-screenshots.log | xcpretty; then
            echo "::group::Raw screenshot test failure tail"
            tail -n 240 xcodebuild-screenshots.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Verify screenshot files
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/l10n-screenshots
        run: |
          set -euo pipefail
          names=(
            zh-recent zh-files zh-tools zh-search zh-settings
            zh-recent-dark zh-tools-dark
            en-recent en-files en-tools en-search en-settings
            en-recent-dark en-tools-dark
          )
          for name in "${names[@]}"; do
            file="$SCREENSHOT_DIR/$name.png"
            test -s "$file"
            echo "ok $file"
          done
          ls -la "$SCREENSHOT_DIR"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: l10n-screenshots
          path: ${{ runner.temp }}/l10n-screenshots/*.png
          if-no-files-found: error

name: iOS CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project PrintAssistant.xcodeproj \
            -scheme PrintAssistant \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty

      - name: Select simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Test
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project PrintAssistant.xcodeproj \
            -scheme PrintAssistant \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath "$RUNNER_TEMP/PrintAssistantTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee xcodebuild-test.log | xcpretty; then
            echo "::group::Raw test failure tail"
            tail -n 240 xcodebuild-test.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/PrintAssistantTests.xcresult" ]; then
            mkdir -p "$RUNNER_TEMP/simulator-screenshots"
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/PrintAssistantTests.xcresult" \
              --output-path "$RUNNER_TEMP/simulator-screenshots" || true
          fi

      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: ${{ runner.temp }}/simulator-screenshots
          if-no-files-found: ignore
